<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texas Vote Desk</title>
<meta name="description" content="Intellz Research: the Texas 2026 general election. Final early vote against 2018, 2022 and 2024, who is left for Election Day, and live Election Day turnout.">
<meta property="og:title" content="Texas Vote Desk, Intellz Research">
<meta property="og:description" content="Texas 2026: the final early vote, who is left, and live Election Day turnout.">
<meta property="og:url" content="https://wewincampaigns.com/"><meta property="og:type" content="website">
<link rel="canonical" href="https://wewincampaigns.com/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;
 --page:#05080f;--panel:#0a0f1d;--surface:#0e1426;--raise:#151d35;--line:#1b2440;--line-2:#2a3556;--grid:#172039;--axis:#3a4770;
 --text:#d4dbeb;--strong:#f7f9fd;--muted:#8c97b4;--faint:#5f6b8c;--head:#fff;
 --accent:#ff3d52;--accent-wash:rgba(255,61,82,.10);--hi:#fff;--on-hi:#0a0f1d;--steel:#9fb8e6;
 --rep:#ef5a5f;--dem:#5b8def;--rep-wash:rgba(239,90,95,.12);--dem-wash:rgba(91,141,239,.12);--both:#8e98b0;
 --y2026:#ffffff;--y2024:#b9cdf2;--y2022:#7a93c8;--y2018:#e0b04a;
 --logo-dark:inline-block;--logo-light:none;
 --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
 --page:#eef1f7;--panel:#f7f9fc;--surface:#fff;--raise:#f2f5fb;--line:#dde3ee;--line-2:#c5cedf;--grid:#e8ecf4;--axis:#aab5ca;
 --text:#1a2238;--strong:#070b18;--muted:#56617d;--faint:#8792ab;--head:#0d024d;--accent:#c8102e;--accent-wash:rgba(200,16,46,.07);
 --hi:#0d024d;--on-hi:#fff;--steel:#3a5595;--rep:#d0313d;--dem:#2e63c9;--rep-wash:rgba(208,49,61,.08);--dem-wash:rgba(46,99,201,.08);--both:#8792ab;
 --y2026:#0d024d;--y2024:#5c73ad;--y2022:#97afdf;--y2018:#b7861c;--logo-dark:none;--logo-light:inline-block}}
:root[data-theme="light"]{color-scheme:light;
 --page:#eef1f7;--panel:#f7f9fc;--surface:#fff;--raise:#f2f5fb;--line:#dde3ee;--line-2:#c5cedf;--grid:#e8ecf4;--axis:#aab5ca;
 --text:#1a2238;--strong:#070b18;--muted:#56617d;--faint:#8792ab;--head:#0d024d;--accent:#c8102e;--accent-wash:rgba(200,16,46,.07);
 --hi:#0d024d;--on-hi:#fff;--steel:#3a5595;--rep:#d0313d;--dem:#2e63c9;--rep-wash:rgba(208,49,61,.08);--dem-wash:rgba(46,99,201,.08);--both:#8792ab;
 --y2026:#0d024d;--y2024:#5c73ad;--y2022:#97afdf;--y2018:#b7861c;--logo-dark:none;--logo-light:inline-block}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--page);color:var(--text);font:16px/1.55 var(--f-body);overflow-x:clip}
a{color:var(--steel)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--head)}
.brand img.d{display:var(--logo-dark)} .brand img.l{display:var(--logo-light)}
.brand-name{font:800 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.tabs a{color:var(--muted);text-decoration:none;font:600 14px var(--f-body);padding:8px 10px;border-radius:5px;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--strong)}
.tabs a.on{color:var(--strong);border-bottom-color:var(--accent);border-radius:5px 5px 0 0}
.tabs a.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:6px;padding:6px 9px;cursor:pointer;font:600 13px var(--f-body)}
.status{background:var(--accent);color:#fff;font:600 14px/1.4 var(--f-body);padding:9px 16px;text-align:center}
.status a{color:#fff}
main{padding-block:28px 60px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{font:900 clamp(38px,6vw,66px)/.98 var(--f-display);color:var(--head);margin:0 0 14px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font:800 clamp(26px,3.4vw,36px)/1.05 var(--f-display);color:var(--head);margin:0 0 6px;text-transform:uppercase;text-wrap:balance}
h3{font:700 17px var(--f-body);color:var(--strong);margin:0 0 6px}
.lede{font-size:19px;max-width:68ch;color:var(--text);margin:0 0 6px}
.deck{color:var(--muted);max-width:72ch;margin:0 0 18px}
section{margin-top:44px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.tile .k{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 46px/1.05 var(--f-display);color:var(--hi);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v.r{color:var(--rep)} .tile .v.d{color:var(--dem)}
.tile .s{color:var(--muted);font-size:14px}
ul.pts{margin:0;padding-left:20px;max-width:75ch} ul.pts li{margin:8px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--raise);position:sticky;top:0;cursor:default}
th[data-k]{cursor:pointer} th[data-k]:hover{color:var(--strong)}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.R{color:var(--rep);font-weight:700} .D{color:var(--dem);font-weight:700}
.pos{color:var(--rep)} .neg{color:var(--dem)}
.src{font-size:12.5px;color:var(--faint);margin-top:10px;max-width:90ch}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:12px var(--f-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.bars .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;margin:9px 0}
.bars .track{height:22px;background:var(--raise);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;border-radius:4px}
.bars .lab{font:700 15px var(--f-body);color:var(--strong);font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--accent);background:var(--accent-wash);padding:10px 14px;border-radius:0 6px 6px 0;max-width:80ch}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:2px 7px;border-radius:20px;border:1px solid var(--line-2);color:var(--muted);letter-spacing:.05em}
.tt{position:fixed;pointer-events:none;background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--strong);z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--faint);font-size:13px}
@media (max-width:640px){.tile .v{font-size:38px}.bars .row{grid-template-columns:110px 1fr auto}}
</style>
</head>
<body>
<header class="bar">
 <div class="wrap bar-in">
  <a class="brand" href="#home" aria-label="Texas Vote Desk, home">
   <img class="d" src="assets/intellz-dark.png" alt="Intellz" width="94" height="30"><img class="l" src="assets/intellz-light.png" alt="Intellz" width="94" height="30">
   <span class="brand-name">Texas Vote Desk</span></a>
  <nav class="tabs" id="tabs" aria-label="Pages"></nav>
  <button class="icon-btn" id="themeBtn" type="button">Theme</button>
 </div>
</header>
<div class="status" id="status">Texas general election, Tuesday 3 November 2026. Polls close at 7 pm local time. <a href="#live">Live Election Day turnout</a></div>
<main id="main"><div class="wrap"><p>Loading</p></div></main>
<footer><div class="wrap">Intellz Research · <a href="https://www.intellz.com" rel="noopener">intellz.com</a> · Aggregate counts only; no voter names or IDs. Not affiliated with any candidate. Figures are graded on the Method page.</div></footer>
<div class="tt" id="tt"></div>
<script>
const PAGES=[['home','Home'],['live','Live Election Day'],['early','Early vote'],['left','Who is left'],['counties','Counties'],['polls','Polls and markets'],['method','Method']];
let T=null,L=null,liveTimer=null;
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n==null?'–':Number(n).toLocaleString('en-US');
const mil=(n,d=2)=>(n/1e6).toFixed(d)+'M';
const edge=v=>(v>0?'R+':'D+')+fmt(Math.abs(v));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tt=$('#tt');
function tip(e,html){tt.innerHTML=html;tt.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tt.offsetWidth-8);tt.style.left=x+'px';tt.style.top=(e.clientY+14)+'px'}
function untip(){tt.style.display='none'}
function tile(k,v,s,cls=''){return `<div class="card tile"><div class="k">${k}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`}
function bars(rows,max){return `<div class="bars">`+rows.map(([lab,v,col,txt])=>`<div class="row"><div>${lab}</div><div class="track"><div class="fill" style="width:${Math.max(1,Math.abs(v)/max*100)}%;background:var(${col})"></div></div><div class="lab">${txt}</div></div>`).join('')+`</div>`}
function table(cols,rows,id){return `<div class="tbl"><table id="${id||''}"><thead><tr>${cols.map(c=>`<th${c[2]?` data-k="${c[2]}"`:''}>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}

function nav(){const r=route();$('#tabs').innerHTML=PAGES.map(([k,t])=>`<a href="#${k}" class="${k===r?'on ':''}${k==='live'?'live':''}">${t}</a>`).join('')}
function route(){const h=location.hash.slice(1);return PAGES.some(p=>p[0]===h)?h:'home'}

function pageHome(){const F=T.final,lf=T.left;return `
<p class="eyebrow">Intellz Research · Texas general · ${T.as_of}</p>
<h1>The early vote is over. Tuesday decides it.</h1>
<p class="lede">${fmt(F.ev)} Texans voted early, ${F.pct.toFixed(1)}% of registered voters: above the 2018 midterm (38.5%) and 85% of the 2024 presidential early vote. For the first time in years, voters with a Democratic primary history out-voted those with a Republican one.</p>
<section class="grid g4" style="margin-top:22px">
${tile('Early votes, final',mil(F.ev),`${F.pct.toFixed(1)}% of ${mil(F.reg,1)} registered`)}
${tile('Primary-history edge','D+25,836','R+565,133 in 2022, R+944,796 in 2024','d')}
${tile('Republican edge, primary voters still out','R+'+fmt(lf.gap),`R ${fmt(lf.R)} against D ${fmt(lf.D)}`,'r')}
${tile('Election Day so far','<span id="homeLive">–</span>','<span id="homeLiveSub">Live counties, refreshed every few minutes</span>')}
</section>
<section><h2>What it means</h2><ul class="pts">
<li><b>Democrats banked early; Republicans won every day of the final week.</b> Day 1 went D+92,189; each day from Monday 26 to Friday 30 October went Republican.</li>
<li><b>Republicans have about 289,000 more primary voters left to vote</b>, and 123,000 more of their strongest partisans. A normal Election Day nets Republicans 200,000 to 250,000 among primary voters.</li>
<li><b>The Senate race turns on the roughly 4 million voters who have never voted in a primary.</b> Talarico needs them to break about 6 points his way to tie. Since 2018 only Beto's 2018 Senate race went that far.</li>
<li><b>Polls and markets lean Talarico</b> (RCP average +1.4; Kalshi 75). In 2020 and 2024 Texas polls ran too Democratic.</li>
</ul></section>
<section><h2>Early vote, four elections</h2><p class="deck">Statewide, at the end of early voting.</p>
${table([['Year'],['Early votes'],['% of registered'],['Primary-history edge'],['Result']],T.years.map(y=>`<tr><td>${y.y}</td><td>${fmt(y.ev)}</td><td>${y.pct.toFixed(1)}%</td><td class="${y.edge>0?'R':'D'}">${edge(y.edge)}</td><td>${y.result}</td></tr>`).join(''))}
<p class="src">Texas Secretary of State early-vote files; primary-history edge from Derek Ryan's voter-file analyses (2026 cross-checked against Transparency USA: D+24,915).</p></section>`}

function pageEarly(){const P=T.pace30;return `
<p class="eyebrow">Early vote · final</p><h1>Above the 2018 pace, below 2024</h1>
<p class="lede">Early votes as a share of registered voters in the 30 largest counties, every day of early voting.</p>
<section class="card chart" style="margin-top:18px"><div class="legend">${['2026','2024','2018','2022'].map(y=>`<span><i style="background:var(--y${y});height:${y==='2026'?4:3}px"></i>${y}${y==='2026'?' (final)':''}</span>`).join('')}</div><div id="paceChart"></div>
<p class="src">Texas Secretary of State early-vote files, 2018 to 2026, 30 largest counties. 2026 Friday completed from county election offices. Statewide 2026: ${fmt(T.final.ev)} (${T.final.pct.toFixed(1)}%).</p></section>
<section><h2>Each day, by primary history</h2><p class="deck">That day's early voters with a Republican-only primary history minus those with a Democratic-only one.</p>
<div class="card chart"><div id="edgeChart"></div><p class="src">Transparency USA / JPM Strategies daily snapshots of Texas SOS voter history. Day 1 includes mail ballots received before early voting. Final: D+24,915 (Transparency USA), D+25,836 (Ryan).</p></div></section>
<section class="grid g2"><div class="card"><h3>Who voted early, by history</h3><p class="deck" style="margin:0 0 6px">Share of 2026 early votes</p>
${bars(Object.entries(T.mix['2026']).map(([k,v])=>[k,v,k==='R only'?'--rep':k==='D only'?'--dem':'--both',v+'%']),40)}
<p class="src">Derek Ryan voter-file analysis, 1 November. In 2022: Republican-only 38%, Democratic-only 27%.</p></div>
<div class="card"><h3>How much of each group has voted</h3><p class="deck" style="margin:0 0 6px">Share of the group that voted early in 2026</p>
${bars(T.participation.map(([k,v,v24])=>[k,v,'--steel',v+'%'+(v24?` <span class="pill">2024: ${v24}%</span>`:'')]),100)}</div></section>
<section class="card"><h3>The early electorate on a partisanship model</h3><p class="deck">Lean of everyone who voted early, scored on a commercial voter file's partisanship model.</p>
${bars(T.model_lean.map(([y,v])=>[String(y),v,'--rep','R+'+v]),15)}
<p class="src">2026 is the least Republican early electorate of the four. Model counts as of 30 October.</p></section>`}

function pageLeft(){const l=T.left;return `
<p class="eyebrow">Election Day · who is left</p><h1>Republicans have more voters left</h1>
<p class="lede">Primary voters who had not voted when early voting closed on Friday 30 October.</p>
<section class="card" style="margin-top:18px">${bars([['Republican primary voters',l.R,'--rep',fmt(l.R)],['Democratic primary voters',l.D,'--dem',fmt(l.D)]],l.R)}
<p style="margin:12px 0 0;font:800 26px var(--f-display);color:var(--head)">Republican edge: <span class="R">${fmt(l.gap)}</span></p>
<p class="src">Transparency USA / JPM Strategies (Texas SOS voter history, 31 October). Ryan's "most likely" subset: R 886,000, D 596,000, a 289,717 gap.</p></section>
<section class="grid g3">${tile('Strong Republicans still out',fmt(l.strongR),'commercial voter file model','r')}${tile('Strong Democrats still out',fmt(l.strongD),'commercial voter file model','d')}${tile('Never voted in a primary','~9.6M','4.54M general-only, 5.05M with no history; mostly low propensity')}</section>
<section><h2>How big Election Day will be</h2>
${table([['Year'],['Election Day plus late ballots']],T.ed_past.map(([y,v])=>`<tr><td>${y}</td><td>${mil(v,2)}</td></tr>`).join('')+`<tr><td><b>2026 estimate</b></td><td><b>${mil(T.ed_range[0],1)} to ${mil(T.ed_range[1],1)}</b></td></tr>`)}
<p class="src">Total votes expected: ${mil(T.total_range[0],1)} to ${mil(T.total_range[1],1)}, 52 to 55% of registered (53.0% in 2018). An estimate.</p></section>
<section class="grid g2"><div><h2>The Senate math</h2><p class="deck">What Talarico needs from no-primary voters to tie, by Election Day size. Estimate, not a forecast.</p>
${table([['Election Day'],['Primary-voter net'],['Talarico needs']],T.senate_math.map(r=>`<tr><td>${mil(r[0],1)}</td><td class="R">${r[1]}</td><td class="D">${r[2]}</td></tr>`).join(''))}</div>
<div><h2>If they break like past races</h2><p class="deck">No-primary voters split as in each past race, with a 2.4M Election Day.</p>
${table([['Pattern'],['No-primary split'],['2026 Senate']],T.patterns.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[3]}">${r[2]}</td></tr>`).join(''))}</div></section>
<p class="note" style="margin-top:22px">"No primary history" is not the same as independent: it includes many Republicans and Democrats who skip primaries. If those voters are as Democratic as the October polls say, Talarico wins; if they look like any Texas electorate since 2018 other than Beto's, Paxton wins by 3 to 5.</p>`}

let sortK='reg',sortD=-1;
function sorted(){const k=sortK;return [...T.counties].sort((a,b)=>k==='county'?sortD*a.county.localeCompare(b.county):sortD*((a[k]??-1e9)-(b[k]??-1e9)))}
const pc=v=>v==null?'–':v+'%';
function countyRows(){return sorted().map(r=>`<tr><td>${r.county}</td><td>${fmt(r.reg)}</td><td><b>${fmt(r.ev)}</b></td><td><b>${r.pct}%</b></td><td>${pc(r.pct22)}</td><td>${pc(r.pct18)}</td><td>${pc(r.pct24)}</td><td>${r.pct22!=null?(r.pct-r.pct22>0?'+':'')+(r.pct-r.pct22).toFixed(1):'–'}</td><td class="${r.m24>0?'pos':'neg'}">${r.m24==null?'–':(r.m24>0?'R+':'D+')+Math.abs(r.m24).toFixed(1)}</td></tr>`).join('')}
function pageCounties(){return `
<p class="eyebrow">Early vote · counties</p><h1>The 30 largest counties</h1>
<p class="lede">Final 2026 early vote against the final early vote in 2018, 2022 and 2024, as a share of registered voters. Click a column to sort.</p>
<section style="margin-top:16px">${table([['County','','county'],['Registered','','reg'],['2026 early','','ev'],['2026 %','','pct'],['2022 %','','pct22'],['2018 %','','pct18'],['2024 %','','pct24'],['vs 2022, pts',''],['2024 pres','','m24']],countyRows(),'ctab')}
<p class="src">Texas Secretary of State early-vote files, final day of early voting each year; 2026 Friday completed from county election offices. 2018 is published for the 30 counties the state tracked that year. 2024 presidential margin from SOS results.</p></section>`}
function pagePolls(){const P=T.polls;return `
<p class="eyebrow">Polls and markets · read ${P.read}</p><h1>The polls lean Talarico</h1>
<p class="lede">In 2020 and 2024, final Texas polls ran too Democratic; in 2018 they ran too Republican.</p>
<section class="grid g4" style="margin-top:18px">${tile('Senate, poll average',P.senate_avg,'RealClearPolling','d')}${tile('Governor, poll average',P.gov_avg,'RealClearPolling','r')}
${tile('Kalshi, Senate',P.kalshi_senate[0]+' '+P.kalshi_senate[1],P.kalshi_senate[2]+' '+P.kalshi_senate[3],'d')}${tile('Kalshi, Governor',P.kalshi_gov[0]+' '+P.kalshi_gov[1],P.kalshi_gov[2]+' '+P.kalshi_gov[3],'r')}</section>
<section class="card"><h3>Latest Senate polls</h3><p style="margin:0">Newest: ${P.senate_newest}. ${P.senate_other}.</p></section>
<section><h2>Texas final polls against the result</h2>${table([['Race'],['Final polls'],['Result']],T.misses.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td></tr>`).join(''))}
<p class="src">RealClearPolling final averages; Texas SOS results.</p></section>`}

function pageMethod(){return `
<p class="eyebrow">Method</p><h1>Where every number comes from</h1>
<section class="grid g2" style="margin-top:12px">
<div class="card"><h3>Early vote</h3><p>Texas Secretary of State early-voting turnout files (Civix portal), every county, in person plus mail. Friday 30 October in-person counts were completed from county election offices where the state file lagged; the statewide total reconciles to ${fmt(T.final.ev)}.</p></div>
<div class="card"><h3>Primary history</h3><p>Early voters matched to Texas primary rosters. Daily and final counts from Transparency USA / JPM Strategies snapshots; final edge and group shares from Derek Ryan's published voter-file analysis. The two agree within about 1,000 votes.</p></div>
<div class="card"><h3>Partisanship model</h3><p>Lean and "strong partisan" counts from a commercial voter file's partisanship model, counted statewide as of 30 October. A model, not a party registration: Texas has none.</p></div>
<div class="card"><h3>Live Election Day</h3><p>Dallas County's vote-center finder (live check-ins at all 444 sites); the ElectionLink turnout pages for Travis, Montgomery, Bell, McLennan, Hays, Ellis, Hockley and Madison; Harris County's wait-time map. Read every five minutes. Unofficial; the canvass is official.</p></div>
<div class="card"><h3>Estimates</h3><p>The Election Day size, the Senate math and the "if they break like" table are Intellz estimates calibrated on 2018 to 2024 statewide results. They are scenarios, not forecasts.</p></div>
<div class="card"><h3>Privacy</h3><p>Aggregate counts only. This site never shows a voter's name, address or ID.</p></div></section>`}

function pageLive(){return `
<p class="eyebrow">Live · Tuesday 3 November 2026</p><h1>Election Day turnout, live</h1>
<p class="lede">Ballots cast today in the counties that publish a live count, against their full Election Day in 2022 and 2024.</p>
<p class="src" id="liveStamp">Loading</p>
<section class="grid g4" id="liveTiles" style="margin-top:12px"></section>
<section><h2>By county</h2><p class="deck">"Mix lean" weighs each county's share of today's vote against its share in 2022, using each county's 2022 Election Day margin. Positive means today's vote is coming from redder counties than in 2022.</p><div id="liveCounties"></div></section>
<section class="grid g2"><div><h2>Dallas: busiest sites</h2><p class="deck">Check-ins so far today at the 444 vote centers.</p><div id="liveDallas"></div></div>
<div><h2>Harris: lines</h2><p class="deck">Harris publishes wait times, not counts.</p><div id="liveHarris"></div></div></section>
<p class="note" style="margin-top:24px">Unofficial, from county websites, refreshed about every five minutes. Results start after polls close at 7 pm.</p>`}

function renderLive(){if(!L||route()!=='live'&&route()!=='home')return;
 const hl=$('#homeLive');if(hl){hl.textContent=fmt(L.total);$('#homeLiveSub').textContent=`${L.counties.length} live counties, ${L.pct_of_22}% of their 2022 Election Day · ${L.as_of.split(' ').slice(1).join(' ')}`}
 if(route()!=='live')return;
 $('#liveStamp').textContent='Last read '+L.as_of+' Central. This page refreshes itself.';
 const mix=L.mix_lean_vs_22;
 $('#liveTiles').innerHTML=tile('Voted today, live counties',fmt(L.total),`${L.counties.length} counties`)+tile('Share of their 2022 Election Day',L.pct_of_22+'%',`2022 full day: ${fmt(L.base22_total)}`)
  +tile('Mix lean vs 2022',(mix>0?'R+':'D+')+Math.abs(mix).toFixed(1),'geography of today\'s vote',mix>0?'r':'d')
  +tile('Dallas average wait',(L.dallas&&L.dallas.avg_wait!=null?L.dallas.avg_wait+' min':'–'),`Harris: ${fmt(L.harris&&L.harris.in_line)} people in line`);
 $('#liveCounties').innerHTML=table([['County'],['Today'],['2022 full day'],['% of 2022'],['% of 2024'],['2022 ED margin'],['Updated']],
  L.counties.map(c=>`<tr><td>${c.county.replace('Mclennan','McLennan')}</td><td><b>${fmt(c.today)}</b></td><td>${fmt(c.ed22)}</td><td>${c.pct22}%</td><td>${c.pct24}%</td><td class="${c.m22>0?'pos':'neg'}">${(c.m22>0?'R+':'D+')+Math.abs(c.m22).toFixed(1)}</td><td>${c.updated}</td></tr>`).join(''));
 $('#liveDallas').innerHTML=L.dallas?table([['Site'],['City'],['Today'],['2022 day']],L.dallas.top.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td><b>${fmt(s[2])}</b></td><td>${fmt(s[3])}</td></tr>`).join('')):'';
 const H=L.harris;$('#liveHarris').innerHTML=H?`<div class="card">${bars(Object.entries(H.bands).map(([k,v])=>[k,v,'--steel',fmt(v)+' sites']),H.sites)}</div>`+table([['Longest lines'],['City'],['In line']],H.worst.slice(0,6).map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td>${fmt(s[2])}</td></tr>`).join('')):'';}
async function loadLive(){try{const r=await fetch('data/ed_live.json?t='+Math.floor(Date.now()/60000),{cache:'no-store'});if(r.ok){L=await r.json();renderLive()}}catch(e){}}

function svgEl(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`}
function paceChart(){const P=T.pace30,el=$('#paceChart');if(!el)return;const W=900,H=380,l=44,r=110,t=12,b=34;
 const x=i=>l+i*(W-l-r)/11,y=v=>t+(H-t-b)*(1-v/50);let g='';
 for(let v=0;v<=50;v+=10)g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--grid')}"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
 P.days.forEach((d,i)=>g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${i===0?'Day 1':d}</text>`);
 const yrs=['2022','2018','2024','2026'];const dy={'2018':12,'2022':0,'2024':0,'2026':-6};
 yrs.forEach(yr=>{const c=css('--y'+yr),w=yr==='2026'?3.5:2;g+=`<polyline points="${P[yr].map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
  g+=`<circle cx="${x(11)}" cy="${y(P[yr][11])}" r="${w+2}" fill="${c}" stroke="${css('--surface')}" stroke-width="2"/><text x="${x(11)+10}" y="${y(P[yr][11])+4+dy[yr]}" style="fill:${css('--strong')};font-weight:700">${yr} ${P[yr][11].toFixed(1)}%</text>`});
 P.days.forEach((d,i)=>g+=`<rect x="${x(i)-(W-l-r)/22}" y="${t}" width="${(W-l-r)/11}" height="${H-t-b}" fill="transparent" data-i="${i}"/>`);
 el.innerHTML=svgEl(W,H,g);el.querySelectorAll('rect[data-i]').forEach(rc=>{rc.onmousemove=e=>{const i=+rc.dataset.i;tip(e,`<b>EV day ${i+1} (${P.days[i]})</b><br>`+['2026','2024','2018','2022'].map(yr=>`${yr}: ${P[yr][i].toFixed(1)}%`).join('<br>'))};rc.onmouseleave=untip})}
function edgeChart(){const el=$('#edgeChart');if(!el)return;const D=T.daily_edge,W=900,rh=34,H=D.length*rh+30,mid=520,sc=330/92189;let g=`<line x1="${mid}" x2="${mid}" y1="0" y2="${H-24}" stroke="${css('--axis')}"/>`
 +`<text x="${mid-8}" y="${H-6}" text-anchor="end" style="fill:${css('--dem')}">← Democratic</text><text x="${mid+8}" y="${H-6}" style="fill:${css('--rep')}">Republican →</text>`;
 D.forEach(([d,v],i)=>{const yy=4+i*rh,bw=Math.max(3,Math.abs(v)*sc),bx=v>0?mid:mid-bw,c=css(v>0?'--rep':'--dem');
  g+=`<rect x="${bx}" y="${yy}" width="${bw}" height="${rh-10}" rx="3" fill="${c}"><title>${d}: ${edge(v)}</title></rect>`;
  g+=`<text x="${v>0?bx+bw+6:bx-6}" y="${yy+rh/2}" text-anchor="${v>0?'start':'end'}" style="fill:${css('--strong')};font-weight:700">${edge(v)}</text>`;
  g+=`<text x="${v>0?mid-8:mid+8}" y="${yy+rh/2}" text-anchor="${v>0?'end':'start'}">${d}</text>`});
 el.innerHTML=svgEl(W,H,g)}

function render(){nav();const r=route();const m=$('#main');
 const P={home:pageHome,live:pageLive,early:pageEarly,left:pageLeft,counties:pageCounties,polls:pagePolls,method:pageMethod}[r];
 m.innerHTML=`<div class="wrap">${P()}</div>`;document.title=(r==='home'?'':PAGES.find(p=>p[0]===r)[1]+' · ')+'Texas Vote Desk';
 if(r==='early'){paceChart();edgeChart()} if(r==='counties')wireSort(); renderLive(); scrollTo(0,0)}
function wireSort(){document.querySelectorAll('#ctab th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:(k==='county'?1:-1);sortK=k;$('#ctab tbody').innerHTML=countyRows()})}
$('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');render()};
addEventListener('hashchange',render);
(async()=>{T=await (await fetch('data/tx_final.json')).json();render();await loadLive();liveTimer=setInterval(loadLive,60000)})();
</script>
