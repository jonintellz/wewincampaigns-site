<title>Intellz Early Vote Desk</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Intellz Research: the 2026 early vote measured like for like, state by state, with every figure graded and sourced.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: "the desk", national. One app shell: a persistent navy-black bar with the Intellz mark and the primary tabs
   (a menu on phones), then one page per tab (Home, Texas, Nation, Races, Polls, Fake polls, Coverage, Method, Desk).
   A state page is a template filled from data/states/<abbr>.json, with its own sub-navigation.
   Colour: red, white and blue lead. White is the ink and the emphasis mark, brand red is chrome only (eyebrows, section
   numbers, the active tab, focus), navy is the ground. Party red and blue are DATA colours, used only for party measures.
   Non-partisan measures use one steel-blue ramp, never red. Dark first; the light theme is a cool-paper mirror. */
:root {
  color-scheme: dark;
  /* ground: deep navy-black */
  --page: #05080f; --panel: #0a0f1d; --surface: #0e1426; --raise: #151d35;
  --line: #1b2440; --line-2: #2a3556; --grid: #172039; --axis: #3a4770;
  /* ink */
  --text: #d4dbeb; --strong: #f7f9fd; --muted: #8c97b4; --faint: #5f6b8c; --head: #ffffff;
  /* brand chrome: Intellz red, lifted for screen; navy as a wash */
  --accent: #ff3d52; --accent-soft: #c22a3c; --accent-wash: rgba(255,61,82,.10);
  --navy: #0d024d; --navy-wash: rgba(40,58,170,.30);
  /* data emphasis (2026, the key mark) and its text */
  --hi: #ffffff; --on-hi: #0a0f1d;
  /* one non-partisan data colour */
  --steel: #9fb8e6; --steel-wash: rgba(159,184,230,.12);
  /* party data colours (validated on #0e1426) */
  --rep: #ef5a5f; --dem: #5b8def; --rep-wash: rgba(239,90,95,.10); --dem-wash: rgba(91,141,239,.10);
  /* neutral steps for "both parties" and "no primary" */
  --both: #8e98b0; --none: #36415f;
  /* year ramp, ordinal: 2026 is the white mark, older years step down one steel hue (validated --ordinal) */
  --y2026: #ffffff; --y2024: #b9cdf2; --y2022: #97afdf; --y2020: #7a93c8; --y2018: #6178b0; --y2016: #4d6398;
  /* sequential steel ramp for non-partisan ratios (low to high; validated --ordinal) */
  --seq-1: #30499a; --seq-2: #3d63c4; --seq-3: #5d89e6; --seq-4: #9fbff6; --seq-5: #e4edfd;
  --div-mid: #4b5675;
  --ok: #cfe0ff;
  --logo-dark: inline-block; --logo-light: none;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 40px rgba(0,0,0,.40);
  /* type */
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-11: 11px; --s-12: 12px; --s-13: 13px; --s-14: 14px; --s-16: 16px; --s-18: 18px; --s-22: 22px; --s-28: 28px; --s-40: 40px;
  --gutter: 16px; --maxw: 1240px; --bar-h: 58px; --radius: 6px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #eef1f7; --panel: #f7f9fc; --surface: #ffffff; --raise: #f2f5fb;
    --line: #dde3ee; --line-2: #c5cedf; --grid: #e8ecf4; --axis: #aab5ca;
    --text: #1a2238; --strong: #070b18; --muted: #56617d; --faint: #8792ab; --head: #0d024d;
    --accent: #c8102e; --accent-soft: #e07583; --accent-wash: rgba(200,16,46,.07);
    --navy: #0d024d; --navy-wash: rgba(13,2,77,.06);
    --hi: #0d024d; --on-hi: #ffffff;
    --steel: #3a5595; --steel-wash: rgba(58,85,149,.08);
    --rep: #d0313d; --dem: #2e63c9; --rep-wash: rgba(208,49,61,.07); --dem-wash: rgba(46,99,201,.07);
    --both: #8792ab; --none: #d3dae8;
    --y2026: #0d024d; --y2024: #22397a; --y2022: #3f5895; --y2020: #5c73ad; --y2018: #7a8fc2; --y2016: #8fa2cf;
    --seq-1: #97b0e3; --seq-2: #7393d6; --seq-3: #5274c2; --seq-4: #3555a5; --seq-5: #1d3479;
    --div-mid: #a3acc0;
    --ok: #24427f;
    --logo-dark: none; --logo-light: inline-block;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px rgba(13,2,77,.07);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #eef1f7; --panel: #f7f9fc; --surface: #ffffff; --raise: #f2f5fb;
  --line: #dde3ee; --line-2: #c5cedf; --grid: #e8ecf4; --axis: #aab5ca;
  --text: #1a2238; --strong: #070b18; --muted: #56617d; --faint: #8792ab; --head: #0d024d;
  --accent: #c8102e; --accent-soft: #e07583; --accent-wash: rgba(200,16,46,.07);
  --navy: #0d024d; --navy-wash: rgba(13,2,77,.06);
  --hi: #0d024d; --on-hi: #ffffff;
  --steel: #3a5595; --steel-wash: rgba(58,85,149,.08);
  --rep: #d0313d; --dem: #2e63c9; --rep-wash: rgba(208,49,61,.07); --dem-wash: rgba(46,99,201,.07);
  --both: #8792ab; --none: #d3dae8;
  --y2026: #0d024d; --y2024: #22397a; --y2022: #3f5895; --y2020: #5c73ad; --y2018: #7a8fc2; --y2016: #8fa2cf;
  --seq-1: #97b0e3; --seq-2: #7393d6; --seq-3: #5274c2; --seq-4: #3555a5; --seq-5: #1d3479;
  --div-mid: #a3acc0;
  --ok: #24427f;
  --logo-dark: none; --logo-light: inline-block;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px rgba(13,2,77,.07);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #05080f; --panel: #0a0f1d; --surface: #0e1426; --raise: #151d35;
  --line: #1b2440; --line-2: #2a3556; --grid: #172039; --axis: #3a4770;
  --text: #d4dbeb; --strong: #f7f9fd; --muted: #8c97b4; --faint: #5f6b8c; --head: #ffffff;
  --accent: #ff3d52; --accent-soft: #c22a3c; --accent-wash: rgba(255,61,82,.10);
  --navy: #0d024d; --navy-wash: rgba(40,58,170,.30);
  --hi: #ffffff; --on-hi: #0a0f1d;
  --steel: #9fb8e6; --steel-wash: rgba(159,184,230,.12);
  --rep: #ef5a5f; --dem: #5b8def; --rep-wash: rgba(239,90,95,.10); --dem-wash: rgba(91,141,239,.10);
  --both: #8e98b0; --none: #36415f;
  --y2026: #ffffff; --y2024: #b9cdf2; --y2022: #97afdf; --y2020: #7a93c8; --y2018: #6178b0; --y2016: #4d6398;
  --seq-1: #30499a; --seq-2: #3d63c4; --seq-3: #5d89e6; --seq-4: #9fbff6; --seq-5: #e4edfd;
  --div-mid: #4b5675;
  --ok: #cfe0ff;
  --logo-dark: inline-block; --logo-light: none;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 40px rgba(0,0,0,.40);
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + 60px); }
@media (max-width: 900px) { html { scroll-padding-top: calc(var(--bar-h) + 56px); } }
body { margin: 0; background: var(--page); color: var(--text); font: 400 var(--s-16)/1.6 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
a { color: var(--strong); text-decoration-color: var(--accent-soft); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; color: var(--head); }
p { margin: 0; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent) 0 33%, var(--hi) 33% 66%, var(--dem) 66% 100%); opacity: .85; }
.bar-in { height: var(--bar-h); display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; flex: none; }
.brand img { height: 30px; width: auto; }
.logo-dark { display: var(--logo-dark); } .logo-light { display: var(--logo-light); }
.brand-name { font: 800 var(--s-18)/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--head); white-space: nowrap; border-left: 1px solid var(--line-2); padding-left: 10px; }
.tabs { display: flex; align-items: stretch; gap: 0; min-width: 0; overflow-x: auto; scrollbar-width: none; height: var(--bar-h); margin-left: 6px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; display: inline-flex; align-items: center; font: 600 var(--s-13)/1 var(--f-body); color: var(--muted); text-decoration: none; padding: 0 10px; white-space: nowrap; }
.tabs a:hover { color: var(--strong); }
.tabs a[aria-current="page"] { color: var(--strong); }
.tabs a[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--accent); }
.tabs a.internal { color: var(--accent); }
.bar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.asof { font: 500 var(--s-11)/1.2 var(--f-mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.asof b { color: var(--strong); font-weight: 600; }
.icon-btn { flex: none; height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 9px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); border-radius: 5px; cursor: pointer; font: 600 var(--s-12)/1 var(--f-body); }
.icon-btn:hover { border-color: var(--accent-soft); color: var(--strong); }
.icon-btn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
.navpanel { display: none; }
@media (max-width: 1080px) { .asof { display: none; } }
@media (max-width: 900px) {
  .tabs { display: none; }
  .menu-btn { display: inline-flex; }
  .navpanel.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px; padding: 8px var(--gutter) 14px; border-top: 1px solid var(--line); max-width: var(--maxw); margin: 0 auto; }
  .navpanel a { font: 600 var(--s-14)/1.2 var(--f-body); color: var(--text); text-decoration: none; padding: 11px 8px; border-radius: 4px; border-left: 3px solid transparent; }
  .navpanel a[aria-current="page"] { border-left-color: var(--accent); color: var(--strong); background: var(--raise); }
  .navpanel a:hover { background: var(--raise); }
}
@media (max-width: 420px) { .brand-name { display: none; } }
@media (max-width: 520px) { .eyebrow i { display: none; } }

/* sub-navigation inside a page (state pages) */
.subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 40; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.subnav .wrap { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; height: 46px; }
.subnav .wrap::-webkit-scrollbar { display: none; }
.subnav .lbl-state { font: 800 var(--s-16)/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--head); margin-right: 8px; white-space: nowrap; }
.subnav a { font: 600 var(--s-12)/1 var(--f-body); color: var(--muted); text-decoration: none; padding: 7px 9px; border-radius: 14px; white-space: nowrap; border: 1px solid transparent; }
.subnav a span { font-family: var(--f-mono); color: var(--faint); margin-right: 4px; }
.subnav a:hover { color: var(--strong); }
.subnav a.on { color: var(--strong); border-color: var(--line-2); background: var(--raise); }
.subnav a.on span { color: var(--accent); }

/* ---------- pages ---------- */
.page { min-height: 60vh; }
.page-head { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; }
.page-head::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 380px at 88% -20%, var(--navy-wash), transparent 70%), repeating-linear-gradient(90deg, transparent 0 119px, var(--grid) 119px 120px); opacity: .9; pointer-events: none; }
.page-head .wrap { position: relative; padding-block: 44px 36px; display: grid; gap: 14px; }
.eyebrow { font: 600 var(--s-12)/1.4 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.eyebrow i { font-style: normal; color: var(--muted); }
.page-title { font: 900 clamp(44px, 6.4vw, 92px)/.9 var(--f-display); text-transform: uppercase; letter-spacing: -.005em; color: var(--head); }
.page-deck { color: var(--muted); max-width: 70ch; font-size: var(--s-16); }

/* ---------- explainer (home) ---------- */
.explain { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--navy) 38%, var(--page)) 0%, var(--page) 78%); }
.explain::before { content: ""; position: absolute; inset: 0; background: radial-gradient(700px 300px at 10% 0%, var(--accent-wash), transparent 70%), radial-gradient(900px 420px at 95% 10%, var(--navy-wash), transparent 70%); pointer-events: none; }
.explain .wrap { position: relative; padding-block: 52px 56px; display: grid; gap: 26px; }
.explain h1 { font: 900 clamp(40px, 6vw, 84px)/.92 var(--f-display); text-transform: uppercase; letter-spacing: -.005em; color: var(--head); max-width: 18ch; }
.explain h1 em { font-style: normal; color: var(--accent); }
.explain-deck { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: var(--muted); font-size: var(--s-14); max-width: 80ch; }
.points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 980px) { .points { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .points { grid-template-columns: minmax(0, 1fr); } }
.point { position: relative; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 8px; align-content: start; min-width: 0; padding: 18px 18px 14px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.point.lead { grid-column: 1 / -1; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: auto; column-gap: 32px; align-items: start; }
.point.lead > .pl { display: grid; gap: 8px; align-content: start; min-width: 0; }
.point.lead > .viz { align-self: center; min-width: 0; }
.point.lead > .point-foot { grid-column: 1 / -1; }
@media (max-width: 760px) { .point.lead { grid-template-columns: minmax(0, 1fr); } }
.viz-t { font: 600 var(--s-11)/1.35 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.point-n { font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.point h3 { font: 700 var(--s-16)/1.25 var(--f-body); color: var(--strong); }
.point-big { font: 800 clamp(40px, 4vw, 58px)/.95 var(--f-display); color: var(--hi); letter-spacing: -.01em; overflow-wrap: anywhere; }
.point.lead .point-big { font-size: clamp(56px, 6vw, 84px); }
.point-cap { font: 500 var(--s-12)/1.35 var(--f-mono); color: var(--muted); margin-top: -2px; }
.point p.s { font-size: var(--s-16); line-height: 1.5; color: var(--text); max-width: 62ch; }
.point-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 10px; border-top: 1px solid var(--line); font: 500 var(--s-11)/1.3 var(--f-mono); color: var(--muted); }
.point-foot a.proof { margin-left: auto; font: 600 var(--s-12)/1 var(--f-body); color: var(--strong); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 14px; }
.point-foot a.proof:hover { border-color: var(--accent); color: var(--strong); }
.point-foot a.proof::after { content: "→"; color: var(--accent); }
.point details.src { flex-basis: 100%; margin-top: 0; }

/* ---------- Texas hero ---------- */
.thesis { font: 900 clamp(40px, 6.4vw, 92px)/.92 var(--f-display); letter-spacing: -.005em; text-transform: uppercase; color: var(--head); max-width: 17ch; }
.thesis em { font-style: normal; color: var(--accent); }
.thesis-line { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.45; color: var(--text); max-width: 70ch; }
.thesis-note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: var(--s-14); color: var(--muted); max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
@media (max-width: 980px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--panel); padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-label { font: 600 var(--s-12)/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile-value { font: 800 clamp(48px, 5.4vw, 72px)/.95 var(--f-display); color: var(--strong); letter-spacing: -.01em; }
.tile-value.hi { color: var(--hi); }
.tile-value .unit { font-size: .5em; color: var(--muted); margin-left: 4px; font-weight: 700; }
.tile-sub { font-size: var(--s-14); color: var(--text); }
.tile-sub b { color: var(--strong); font-weight: 600; }
.tile-foot { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 500 var(--s-11)/1.3 var(--f-mono); color: var(--muted); }
.claims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .claims { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .claims { grid-template-columns: minmax(0, 1fr); } }
.claim { border-top: 2px solid var(--line-2); padding-top: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.claim.v-mixed { border-top-color: var(--steel); } .claim.v-no { border-top-color: var(--accent); } .claim.v-yes { border-top-color: var(--hi); }
.claim-n { font: 600 var(--s-11)/1 var(--f-mono); color: var(--faint); letter-spacing: .1em; }
.claim p { font-size: var(--s-14); color: var(--text); }
.claim .verdict { font: 700 var(--s-13)/1.2 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--strong); }
.claim .qual { font-size: var(--s-13); color: var(--muted); }
.claim a { font-size: var(--s-12); }

/* ---------- chips, tags ---------- */
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 3px; font: 600 10.5px/1 var(--f-mono); letter-spacing: .02em; border: 1px solid var(--line-2); color: var(--muted); background: transparent; vertical-align: 1px; cursor: help; }
.chip.g-V { background: var(--strong); color: var(--page); border-color: var(--strong); }
.chip.g-M { color: var(--steel); border-color: color-mix(in srgb, var(--steel) 60%, transparent); background: var(--steel-wash); }
.chip.g-R { color: var(--text); border-color: var(--line-2); }
.chip.g-E, .chip.g-I { color: var(--muted); border-style: dotted; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.tag.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.tag.partial { color: var(--steel); border-style: dashed; }
.tag.pending { color: var(--muted); }
.tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.pending .dot, .pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.bear { font: 600 var(--s-11)/1 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; border-radius: 3px; border: 1px solid var(--line-2); white-space: nowrap; }
.bear.supports { color: var(--steel); border-color: color-mix(in srgb, var(--steel) 55%, transparent); }
.bear.against { color: var(--text); border-color: var(--text); }
.bear.neutral { color: var(--muted); }

/* ---------- section bands ---------- */
.band { border-bottom: 1px solid var(--line); padding-block: 60px; }
.band.alt { background: color-mix(in srgb, var(--panel) 60%, var(--page)); }
.band-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 22px; align-items: end; margin-bottom: 22px; }
.band-head.nonum { grid-template-columns: minmax(0, 1fr) auto; }
.band-num { font: 900 clamp(64px, 8vw, 112px)/.8 var(--f-display); color: transparent; -webkit-text-stroke: 1.5px var(--accent); letter-spacing: -.02em; }
.band-title h2 { font: 800 clamp(32px, 4vw, 52px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.band-title .deck { margin-top: 8px; color: var(--muted); max-width: 72ch; font-size: var(--s-16); }
.band-status { align-self: start; display: grid; justify-items: end; gap: 6px; text-align: right; }
.band-asof { font: 500 var(--s-11)/1.35 var(--f-mono); color: var(--muted); max-width: 34ch; }
@media (max-width: 640px) {
  .band { padding-block: 44px; }
  .band-head { grid-template-columns: auto minmax(0, 1fr); align-items: end; }
  .band-head.nonum { grid-template-columns: minmax(0, 1fr); }
  .band-num { font-size: 56px; }
  .band-head:not(.nonum) .band-title { display: contents; }
  .band-head:not(.nonum) .band-title h2 { grid-column: 2; align-self: end; }
  .band-head:not(.nonum) .band-title .deck { grid-column: 1 / -1; }
  .band-status { grid-column: 1 / -1; justify-items: start; text-align: left; }
}
.years { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -6px 0 18px; }
.years .ctl-label { margin-right: 2px; }
.yr { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 12px; font: 600 var(--s-11)/1 var(--f-mono); border: 1px solid var(--line-2); color: var(--strong); white-space: nowrap; }
.yr i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--steel)); }
.yr.off { color: var(--faint); border-style: dashed; }
.yr.off i { background: transparent; border: 1px solid var(--faint); }
.years-note { flex-basis: 100%; font-size: var(--s-12); color: var(--muted); max-width: 90ch; }
.years-note b { color: var(--text); font-weight: 600; }
.card { overflow-wrap: break-word; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.card h3 { font: 800 var(--s-22)/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.card h4 { font: 700 var(--s-16)/1.25 var(--f-body); color: var(--strong); }
.card .sub { color: var(--muted); font-size: var(--s-14); margin-top: 4px; max-width: 70ch; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.card-head > div:first-child { min-width: 0; flex: 1 1 320px; }
.primary { padding: 20px; }
.support { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-top: 14px; }
.support.two { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
@media (max-width: 460px) { .support.two { grid-template-columns: minmax(0, 1fr); } .card, .primary { padding: 14px; } }
.big { font: 800 clamp(40px, 4.4vw, 56px)/.95 var(--f-display); color: var(--strong); }
.big.hi { color: var(--hi); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: var(--s-14); margin-top: 10px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; color: var(--strong); font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: var(--s-13); }
.stamp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font: 500 var(--s-11)/1.3 var(--f-mono); color: var(--muted); }
.note { font-size: var(--s-13); color: var(--muted); margin-top: 10px; max-width: 80ch; }
.note b { color: var(--text); }
.callout { border-left: 2px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 12px; font-size: var(--s-14); color: var(--text); }

/* ---------- controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 var(--s-12)/1 var(--f-body); padding: 9px 11px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--strong); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--strong); box-shadow: inset 0 -2px 0 var(--accent); }
.ctl-label { font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ychips { display: flex; flex-wrap: wrap; gap: 6px; }
.ychip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line-2); background: transparent; color: var(--muted); font: 600 var(--s-12)/1 var(--f-mono); cursor: pointer; }
.ychip i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); opacity: .35; }
.ychip.est i { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.ychip[aria-pressed="true"] { color: var(--strong); border-color: var(--axis); background: var(--raise); }
.ychip[aria-pressed="true"] i { opacity: 1; }
.ychip.y2026[aria-pressed="true"] { border-color: var(--hi); }
.ychip:disabled { opacity: .35; cursor: not-allowed; }
.linkbtn { border: 0; background: none; color: var(--muted); font: 600 var(--s-12)/1 var(--f-body); cursor: pointer; padding: 6px 0; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--strong); }
input.find { height: 34px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel); color: var(--strong); padding: 0 10px; font: 500 var(--s-13)/1 var(--f-body); width: 190px; max-width: 100%; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; min-width: 0; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.ax text { font: 500 11px var(--f-mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
.ax line, .ax path { stroke: var(--axis); }
.gridl line { stroke: var(--grid); stroke-width: 1; }
.gridl path { display: none; }
.lbl { font: 600 12px var(--f-mono); fill: var(--text); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--strong); }
.lbl.muted { fill: var(--muted); font-weight: 500; }
.lbl.hi { fill: var(--hi); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font: 500 var(--s-12)/1.2 var(--f-body); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend i.ln { height: 3px; width: 16px; border-radius: 2px; }
.legend i.ln.est { width: 22px; background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); }
.chart-foot { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; margin-top: 10px; }
.small-multiples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
@media (max-width: 640px) { .small-multiples { grid-template-columns: minmax(0, 1fr); } }
.sm-title { font: 600 var(--s-12)/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

#tt { position: fixed; z-index: 90; pointer-events: none; min-width: 170px; max-width: 300px; background: var(--raise); color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; box-shadow: 0 16px 40px rgba(0,0,0,.35); font-size: var(--s-13); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
#tt.on { opacity: 1; transform: none; }
#tt .tt-h { font: 600 var(--s-11)/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#tt .tt-r { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 2px 0; }
#tt .tt-r i { height: 3px; border-radius: 2px; background: var(--c); }
#tt .tt-r i.sq { height: 10px; border-radius: 2px; }
#tt .tt-r b { font: 600 var(--s-13)/1.2 var(--f-mono); color: var(--strong); font-variant-numeric: tabular-nums; }
#tt .tt-r span { color: var(--muted); font-size: var(--s-12); }
#tt .tt-n { margin-top: 6px; color: var(--muted); font-size: var(--s-12); }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 5px; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--s-13); }
table.t th, table.t td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 var(--s-11)/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel); position: sticky; top: 0; white-space: nowrap; }
table.t th button { all: unset; cursor: pointer; }
table.t th button:focus-visible { outline: 2px solid var(--accent); }
table.t th[aria-sort] button::after { content: " ↕"; color: var(--faint); }
table.t th[aria-sort="ascending"] button::after { content: " ↑"; color: var(--accent); }
table.t th[aria-sort="descending"] button::after { content: " ↓"; color: var(--accent); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.dim td { opacity: .38; }
.compact table.t th, .compact table.t td { padding: 6px 6px; }
.tbl-wrap.tall { max-height: 620px; overflow: auto; }
.support .span2 { grid-column: span 2; }
@media (max-width: 900px) { .support .span2 { grid-column: auto; } }
table.t tbody tr:hover td { background: var(--raise); }
.pill { display: inline-block; font: 600 10px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--muted); margin: 0 4px 3px 0; white-space: nowrap; }
.pill.wrap { white-space: normal; text-transform: none; letter-spacing: 0; }
.pill.bad { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.pill.hi { color: var(--strong); border-color: var(--strong); }
.pill.steel { color: var(--steel); border-color: color-mix(in srgb, var(--steel) 55%, transparent); }
.lean-d { color: var(--dem); font-weight: 600; } .lean-r { color: var(--rep); font-weight: 600; }
.pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* ---------- sources drawer ---------- */
details.src { margin-top: 12px; font-size: var(--s-13); }
details.src summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
details.src summary::-webkit-details-marker { display: none; }
details.src summary::before { content: "+"; display: inline-block; width: 14px; color: var(--accent); }
details.src[open] summary::before { content: "−"; }
details.src ul { list-style: none; padding: 8px 0 0; margin: 0; display: grid; gap: 8px; border-top: 1px solid var(--line); }
details.src li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
details.src li a { word-break: break-word; }
details.src li .m { display: block; color: var(--muted); font-size: var(--s-12); margin-top: 2px; }

/* ---------- pending ---------- */
.pending { position: relative; border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 22px; background:
  repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--line) 55%, transparent) 14px 15px), var(--surface); min-width: 0; }
.pending-eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.pending-eyebrow .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.pending h4 { font: 800 var(--s-22)/1.05 var(--f-display); text-transform: uppercase; color: var(--head); }
.pending p { color: var(--muted); font-size: var(--s-14); margin-top: 8px; max-width: 66ch; }
.ghost-bars { display: grid; gap: 8px; margin-top: 16px; max-width: 520px; }
.ghost-bars span { display: block; height: 14px; border-radius: 3px; background: linear-gradient(90deg, var(--line-2), var(--line)); }

/* ---------- specific components ---------- */
.meter { display: grid; gap: 6px; margin-top: 12px; }
.meter-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; font-size: var(--s-14); }
.meter-row b { font: 700 var(--s-18)/1 var(--f-mono); color: var(--strong); font-variant-numeric: tabular-nums; }
.meter-track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter-track i { display: block; height: 100%; border-radius: 4px; background: var(--hi); }
.meter-row.alt .meter-track i { background: var(--steel); }
.firms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .firms { grid-template-columns: minmax(0, 1fr); } }
.firm { display: grid; gap: 10px; align-content: start; border-top: 3px solid var(--line-2); }
.firm.admitted { border-top-color: var(--hi); } .firm.partial { border-top-color: var(--steel); } .firm.dark { border-top-color: var(--muted); }
.firm-status { font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.firm dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: var(--s-14); }
.firm dt { font: 600 var(--s-11)/1.5 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.firm dd { margin: 0; }
@media (max-width: 420px) { .firm dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .firm dd { margin-bottom: 8px; } }
.tl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl-list li { display: grid; grid-template-columns: 84px 12px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--s-14); }
.tl-desk { margin-top: 14px; }
.tl-list .d { font: 500 var(--s-12)/1.5 var(--f-mono); color: var(--muted); }
.tl-list .k { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--c); }
.desk { border: 1px solid var(--accent-soft); border-radius: var(--radius); background: repeating-linear-gradient(135deg, var(--accent-wash) 0 10px, transparent 10px 20px) top / 100% 8px no-repeat, var(--surface); padding: 22px 18px 18px; }
.desk-flag { display: inline-flex; gap: 8px; align-items: center; font: 700 var(--s-12)/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent-soft); padding: 6px 9px; border-radius: 3px; }
.desk-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-top: 18px; }
@media (max-width: 860px) { .desk-cols { grid-template-columns: minmax(0, 1fr); } }
.desk-cols h3 { font: 800 var(--s-28)/1 var(--f-display); text-transform: uppercase; margin-bottom: 10px; }
.desk-item { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.desk-item .line { color: var(--strong); font-weight: 600; }
.desk-item .reb { font-size: var(--s-14); color: var(--muted); }
.desk-item .reb b { color: var(--text); font-weight: 600; }
.method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grades li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
.srcgroup summary { font: 700 var(--s-14)/1.3 var(--f-body); color: var(--strong); cursor: pointer; padding: 8px 0; border-top: 1px solid var(--line); }
.srcgroup ul { list-style: none; padding: 0 0 10px; margin: 0; display: grid; gap: 6px; font-size: var(--s-13); }
.srcgroup li a { word-break: break-word; }
footer.foot { padding-block: 48px 64px; border-top: 1px solid var(--line); }
.foot-in { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center; justify-content: space-between; }
.foot-in img { height: 44px; width: auto; }
.foot-in p { color: var(--muted); font-size: var(--s-13); }
.errbox { border: 1px solid var(--accent); color: var(--text); padding: 14px; border-radius: 5px; margin: 20px 0; }
.mapgrid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .mapgrid { grid-template-columns: minmax(0, 1fr); } }
.map-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.map-info { min-height: 96px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: var(--s-14); }
.map-info h4 { margin-bottom: 4px; }
.sumbars h4 { font: 600 var(--s-12)/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.reveal { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { transform: translateY(10px); opacity: .35; } to { transform: none; opacity: 1; } }
.loading { color: var(--muted); font: 500 var(--s-13)/1.4 var(--f-mono); padding: 18px 0; }
/* page cards on home */
.pagecards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .pagecards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .pagecards { grid-template-columns: minmax(0, 1fr); } }
.pagecard { display: grid; gap: 8px; align-content: start; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--text); min-width: 0; }
.pagecard:hover { border-color: var(--accent-soft); color: var(--text); }
.pagecard b { font: 800 var(--s-22)/1 var(--f-display); text-transform: uppercase; color: var(--head); letter-spacing: .02em; }
.pagecard span.d { font-size: var(--s-13); color: var(--muted); }
/* US tile map */
.tilemap { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; max-width: 700px; }
.tm { aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; border-radius: 4px; font: 600 clamp(9px, 1.4vw, 13px)/1 var(--f-mono); color: var(--faint); border: 1px dashed var(--line-2); background: transparent; text-decoration: none; }
.tm.row { background: var(--steel-wash); color: var(--steel); border: 1px solid color-mix(in srgb, var(--steel) 50%, transparent); }
.tm.live { background: var(--hi); color: var(--on-hi); border: 1px solid var(--hi); }
.tm.live:hover, .tm.row:hover { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- the national layer: US map, verdict scale, ledger cells, state switcher ---------- */
/* The verdict on Jon's theory is ordinal, not partisan: it uses the validated steel ramp (supports = lightest in dark mode).
   Party measures on the map (the early-vote shift, the poll-error direction) use the party pair around the neutral midpoint. */
.vcls-supports { --c: var(--seq-5); } .vcls-lean { --c: var(--seq-4); } .vcls-mixed { --c: var(--seq-3); } .vcls-against { --c: var(--seq-1); } .vcls-untested { --c: transparent; }
.vpill { display: inline-flex; align-items: center; gap: 7px; font: 600 var(--s-11)/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--strong); white-space: nowrap; background: var(--panel); }
.vpill i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); border: 1px solid var(--line-2); }
.vpill.vcls-untested i { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 4px); }
.usmap-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px; align-items: start; }

  for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 13) ends[i].ly = ends[i - 1].ly + 13;
  ends.forEach(e => {

    const lx = e.x + 8;
    if (Math.abs(e.ly - e.y) > 3) svg.append('line').attr('x1', e.x + 5).attr('x2', lx - 1).attr('y1', e.y).attr('y2', e.ly).style('stroke', 'var(--axis)');
    svg.append('text').attr('class', 'lbl ' + (e.s.emph ? 'hi' : 'muted')).attr('x', lx).attr('y', e.ly + 4).text(e.s.endLabel != null ? e.s.endLabel : e.s.label);
  });

  cross.append('line').attr('y1', m.t).attr('y2', H - m.b).style('stroke', 'var(--muted)').style('stroke-width', 1);
  const dots = cross.append('g');
  let cur = null;

    const rows = cfg.series.map(s => ({ s, p: s.pts.find(p => p.x === xv) })).filter(r => r.p);

    cross.style('display', null); cross.select('line').attr('x1', x(xv)).attr('x2', x(xv));
    dots.selectAll('circle').data(rows).join('circle').attr('cx', x(xv)).attr('cy', r => y(r.p.y)).attr('r', 4).style('fill', r => r.s.color).style('stroke', 'var(--surface)').style('stroke-width', 2);
    const box = svg.node().getBoundingClientRect();

      const [px] = d3.pointer(ev);

    paths.forEach(p => { if (p.node()._dash) { p.style('opacity', 0).transition().duration(900).style('opacity', 1); return; } const L = p.node().getTotalLength(); p.style('stroke-dasharray', `${L} ${L}`).style('stroke-dashoffset', L).transition().duration(1100).ease(d3.easeCubicOut).style('stroke-dashoffset', 0).on('end', function () { d3.select(this).style('stroke-dasharray', this._dash); }); });
  }
}

/* ---------------------------------------------------------------- generic diverging column chart */
function columnChart(el, cfg) {
  // cfg: {items:[{key,label,v,color,emph,tip}], height, yFmt, zeroLabel, labelFmt}
  const W = el._w || el.clientWidth || 600; const narrow = W < 560;
  const H = cfg.height || (narrow ? 250 : 300);
  const m = { t: 22, r: 10, b: cfg.bottom || 46, l: narrow ? 34 : 42 };
  const xs = d3.scaleBand().domain(cfg.items.map(d => d.key)).range([m.l, W - m.r]).paddingInner(.28).paddingOuter(.12);
  const vals = cfg.items.map(d => d.v);
  const lo = Math.min(0, d3.min(vals)), hi = Math.max(0, d3.max(vals)), pad = (hi - lo) * .1;
  const y = d3.scaleLinear().domain([lo < 0 ? lo - pad : 0, hi > 0 ? hi + pad : 0]).nice(5).range([H - m.b, m.t]);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', cfg.aria || 'Column chart');
  svg.append('g').attr('class', 'gridl').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(''));
  svg.append('g').attr('class', 'ax').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(0).tickPadding(6).tickFormat(cfg.yTick || (v => v))).call(g => g.select('.domain').remove());
  svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(0)).attr('y2', y(0)).style('stroke', 'var(--axis)').style('stroke-width', 1.2);
  const bw = Math.min(24, xs.bandwidth());
  const g = svg.append('g');
  cfg.items.forEach(d => {
    const cx = xs(d.key) + xs.bandwidth() / 2;
    const y0 = y(0), y1 = y(d.v);
    const top = Math.min(y0, y1), hgt = Math.max(1, Math.abs(y1 - y0));
    const r = Math.min(4, hgt / 2, bw / 2);
    // rounded data end, square at the baseline
    const up = d.v >= 0;
    const x0 = cx - bw / 2, x1 = cx + bw / 2;
    const path = up
      ? `M${x0},${y0}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x1 - r}Q${x1},${top} ${x1},${top + r}V${y0}Z`
      : `M${x0},${y0}V${top + hgt - r}Q${x0},${top + hgt} ${x0 + r},${top + hgt}H${x1 - r}Q${x1},${top + hgt} ${x1},${top + hgt - r}V${y0}Z`;
    const bar = g.append('path').attr('d', path).style('fill', d.color).attr('tabindex', 0).attr('role', 'img').attr('aria-label', d.aria || (d.label + ': ' + (cfg.labelFmt ? cfg.labelFmt(d.v) : d.v)));
    if (d.emph) g.append('path').attr('d', path).style('fill', 'none').style('stroke', 'var(--hi)').style('stroke-width', 2).attr('pointer-events', 'none');
    const hit = g.append('rect').attr('x', xs(d.key)).attr('width', xs.bandwidth()).attr('y', m.t).attr('height', H - m.t - m.b).style('fill', 'transparent');
    const show = ev => { bar.style('opacity', .82); const [sx, sy] = ev && ev.clientX != null ? [ev.clientX, ev.clientY] : bboxOf(bar.node()); showTT(d.tip(), sx, sy); };
    const hide = () => { bar.style('opacity', null); hideTT(); };
    hit.on('pointermove pointerdown', show).on('pointerleave', hide);
    bar.on('focus', () => show()).on('blur', hide);
    const lv = cfg.labelFmt ? cfg.labelFmt(d.v) : d.v;
    if (!narrow || cfg.items.length <= 8) svg.append('text').attr('class', 'lbl ' + (d.emph ? 'hi' : 'strong')).attr('x', cx).attr('y', up ? top - 6 : top + hgt + 13).attr('text-anchor', 'middle').style('font-size', narrow ? '10px' : '11px').text(lv);
    const lab = svg.append('text').attr('class', 'lbl muted').attr('text-anchor', 'middle').attr('x', cx).attr('y', H - m.b + 14).style('font-size', narrow ? '9.5px' : '11px');
    String(d.label).split('\n').forEach((t, i) => lab.append('tspan').attr('x', cx).attr('dy', i ? 12 : 0).text(t));
  });
  el.replaceChildren(svg.node());
}

/* ---------------------------------------------------------------- horizontal bar list (ratios, shares) */
function hbars(el, cfg) {
  // cfg: {items:[{label, v, sub, color, tip}], domain:[a,b], ref, fmt, rowH}
  const W = el._w || el.clientWidth || 360; const narrow = W < 420;
  const rowH = cfg.rowH || 34;
  const labW = Math.min(cfg.labW || 190, W * .44);
  const H = cfg.items.length * rowH + 22;
  const valW = cfg.valueCol ? (narrow ? 96 : 116) : 52;
  const x = d3.scaleLinear().domain(cfg.domain).range([labW + 6, W - valW]);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', cfg.aria || 'Bar chart');
  if (cfg.ref != null) {
    svg.append('line').attr('x1', x(cfg.ref)).attr('x2', x(cfg.ref)).attr('y1', 2).attr('y2', H - 18).style('stroke', 'var(--axis)').style('stroke-width', 1.2);
    svg.append('text').attr('class', 'lbl muted').attr('x', x(cfg.ref)).attr('y', H - 4).attr('text-anchor', 'middle').style('font-size', '10px').text(cfg.refLabel || cfg.fmt(cfg.ref));
  }
  cfg.items.forEach((d, i) => {
    const yy = i * rowH + 4;
    const bh = Math.min(16, rowH - 14);
    const t = svg.append('text').attr('class', 'lbl').attr('x', 0).attr('y', yy + bh / 2 + 4).style('font-family', 'var(--f-body)').style('font-size', narrow ? '11px' : '12px').style('fill', 'var(--text)');
    let lab = d.label; if (lab.length > (narrow ? 22 : 30)) lab = lab.slice(0, narrow ? 21 : 29) + '…';
    t.text(lab);
    if (d.v == null) { svg.append('text').attr('class', 'lbl muted').attr('x', labW + 8).attr('y', yy + bh / 2 + 4).text('no data'); return; }
    const x0 = x(cfg.base != null ? cfg.base : cfg.domain[0]), x1 = x(Math.max(cfg.domain[0], Math.min(cfg.domain[1], d.v)));
    const bx = Math.min(x0, x1), bw = Math.max(1, Math.abs(x1 - x0));
    const r = Math.min(4, bh / 2, bw);
    const right = x1 >= x0;
    const p = right ? `M${bx},${yy}H${bx + bw - r}Q${bx + bw},${yy} ${bx + bw},${yy + r}V${yy + bh - r}Q${bx + bw},${yy + bh} ${bx + bw - r},${yy + bh}H${bx}Z`
      : `M${bx + bw},${yy}H${bx + r}Q${bx},${yy} ${bx},${yy + r}V${yy + bh - r}Q${bx},${yy + bh} ${bx + r},${yy + bh}H${bx + bw}Z`;
    const bar = svg.append('path').attr('d', p).style('fill', d.color || 'var(--steel)').attr('tabindex', d.tip ? 0 : null);
    if (cfg.valueCol) svg.append('text').attr('class', 'lbl strong').attr('x', W - 2).attr('text-anchor', 'end').attr('y', yy + bh / 2 + 4).style('font-size', narrow ? '10.5px' : '12px').text(cfg.fmt(d.v));
    else svg.append('text').attr('class', 'lbl strong').attr('x', right ? bx + bw + 6 : bx - 6).attr('text-anchor', right ? 'start' : 'end').attr('y', yy + bh / 2 + 4).text(cfg.fmt(d.v));
    if (d.tip) {
      const hit = svg.append('rect').attr('x', 0).attr('y', yy - 6).attr('width', W).attr('height', rowH).style('fill', 'transparent');
      const show = ev => { bar.style('opacity', .8); const [sx, sy] = ev && ev.clientX != null ? [ev.clientX, ev.clientY] : bboxOf(bar.node()); showTT(d.tip(), sx, sy); };
      hit.on('pointermove pointerdown', show).on('pointerleave', () => { bar.style('opacity', null); hideTT(); });
      bar.on('focus', () => show()).on('blur', () => hideTT());
    }
  });
  el.replaceChildren(svg.node());
}

function renderTurnout() {

/* ================================================================= 3. WHO IS VOTING */
function renderComposition() {
  const C = D.composition;
  const w = band('composition', 3, 'Who is voting', C.basis_note, 'live');
  const years = ['2026', '2024', '2022', '2020'];
  let day = C.years['2026'].value.days.slice(-1)[0].d;
  const maxDay = 12;
  const compEl = chartBox(drawComp);
  const COL = { R: 'var(--rep)', both: 'var(--both)', none: 'var(--none)', D: 'var(--dem)' };
  const LAB = { R: 'Republican primaries only', both: 'Both parties\' primaries', none: 'No primary on record', D: 'Democratic primaries only' };
  function drawComp(el, W) {
    const narrow = W < 560;
    const rowH = narrow ? 52 : 46, labW = narrow ? 42 : 64, rpad = narrow ? 64 : 78;
    const H = years.length * rowH + 30;
    const x = d3.scaleLinear().domain([0, 100]).range([labW, W - rpad]);
    const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', 'Primary-history composition of early voters by year at the same EV day');
    [0, 25, 50, 75, 100].forEach(v => { svg.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', 0).attr('y2', H - 24).style('stroke', 'var(--grid)'); svg.append('text').attr('class', 'lbl muted').attr('x', x(v)).attr('y', H - 8).attr('text-anchor', 'middle').style('font-size', '10px').text(v + '%'); });
    years.forEach((y, i) => {
      const p = C.years[y].value.days.find(q => q.d === day);
      const yy = i * rowH + 8, bh = Math.min(24, rowH - 18);
      svg.append('text').attr('class', 'lbl ' + (y === '2026' ? 'hi' : 'strong')).attr('x', 0).attr('y', yy + bh / 2 + 4).text(y);
      if (!p) { svg.append('text').attr('class', 'lbl muted').attr('x', labW + 4).attr('y', yy + bh / 2 + 4).text(y === '2026' ? 'Not in this build: the source ran through day ' + C.latest.d + ' when read' : 'No data for this day'); return; }
      let acc = 0;
      ['R', 'both', 'none', 'D'].forEach(k => {
        const v = p[k]; const x0 = x(acc), x1 = x(acc + v); acc += v;

/* ---------------------------------------------------------------- a day-count chart: x is days before Election Day, left to right */
function dbeChart(el, cfg) {
  const W = el._w || el.clientWidth || 600; const narrow = W < 520;
  const H = cfg.height ? (narrow ? Math.round(cfg.height * .8) : cfg.height) : (narrow ? 260 : 340);
  const m = { t: 14, r: cfg.rpad != null ? cfg.rpad : (narrow ? 52 : 64), b: 34, l: cfg.lpad || (narrow ? 44 : 54) };
  const all = cfg.series.flatMap(s => s.pts);
  if (!all.length) { el.replaceChildren(h('div', { class: 'loading' }, cfg.empty || 'Nothing to draw for this choice.')); return; }
  const xs = [...new Set(all.map(p => p.x))].sort((a, b) => b - a);
  const xMax = cfg.xMax != null ? cfg.xMax : d3.max(all, p => p.x), xMin = cfg.xMin != null ? cfg.xMin : Math.min(d3.min(all, p => p.x), cfg.xMinCap != null ? cfg.xMinCap : 99);
  const x = d3.scaleLinear().domain([xMax, xMin]).range([m.l, W - m.r]);
  let yLo = cfg.yMin != null ? cfg.yMin : Math.min(0, d3.min(all, p => p.y)), yHi = cfg.yMax != null ? cfg.yMax : d3.max(all, p => p.y);
  if (cfg.symmetric) { const a = Math.max(Math.abs(yLo), Math.abs(yHi), 1); yLo = -a; yHi = a; }
  if (yHi === yLo) yHi = yLo + 1;
  const y = d3.scaleLinear().domain([yLo, yHi]).nice(5).range([H - m.b, m.t]);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('tabindex', 0).attr('aria-label', (cfg.aria || 'Chart by days before Election Day') + '. Use the left and right arrow keys to read each day.');
  if (cfg.zeroBand && y.domain()[0] < 0 && y.domain()[1] > 0) {
    svg.append('rect').attr('x', m.l).attr('width', W - m.r - m.l).attr('y', y(y.domain()[1])).attr('height', y(0) - y(y.domain()[1])).style('fill', 'var(--dem-wash)');
    svg.append('rect').attr('x', m.l).attr('width', W - m.r - m.l).attr('y', y(0)).attr('height', y(y.domain()[0]) - y(0)).style('fill', 'var(--rep-wash)');
    svg.append('text').attr('class', 'lbl muted').attr('x', m.l + 6).attr('y', m.t + 12).text(cfg.zeroBand[0]);
    svg.append('text').attr('class', 'lbl muted').attr('x', m.l + 6).attr('y', H - m.b - 6).text(cfg.zeroBand[1]);
  }
  svg.append('g').attr('class', 'gridl').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(narrow ? 4 : 6).tickSize(-(W - m.l - m.r)).tickFormat(''));
  svg.append('g').attr('class', 'ax').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(narrow ? 4 : 6).tickSize(0).tickPadding(6).tickFormat(cfg.yTick || (v => v))).call(g => g.select('.domain').remove());
  const span = xMax - xMin, step = span > 40 ? 10 : span > 20 ? 5 : span > 10 ? 2 : 1;
  const ticks = d3.range(Math.ceil(xMin / step) * step, xMax + 1, step).filter(v => v >= xMin && v <= xMax);
  svg.append('g').attr('class', 'ax').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(narrow ? ticks.filter((_, i) => i % 2 === 0) : ticks).tickSize(4).tickFormat(v => v === 0 ? 'ED' : 'E-' + v)).call(g => g.select('.domain').style('stroke', 'var(--axis)'));
  svg.append('text').attr('class', 'lbl muted').attr('x', W - m.r).attr('y', H - 3).attr('text-anchor', 'end').style('font-size', '10px').text('days before Election Day');
  if (y.domain()[0] < 0 && y.domain()[1] > 0) svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(0)).attr('y2', y(0)).style('stroke', 'var(--axis)').style('stroke-width', 1.2);
  const line = d3.line().defined(p => p.y != null).x(p => x(p.x)).y(p => y(p.y)).curve(d3.curveMonotoneX);
  const order = cfg.series.slice().sort((a, b) => (a.emph ? 1 : 0) - (b.emph ? 1 : 0));
  order.forEach(s => {
    const pts = s.pts.slice().sort((a, b) => b.x - a.x);
    if (pts.length > 1) svg.append('path').datum(pts).attr('d', line).style('fill', 'none').style('stroke', s.color).style('stroke-width', s.width || 2).style('stroke-dasharray', s.dash || null).style('stroke-linejoin', 'round').style('stroke-linecap', 'round');
    pts.filter(p => pts.length <= 3 || p.mark).forEach(p => svg.append('circle').attr('cx', x(p.x)).attr('cy', y(p.y)).attr('r', 4).style('fill', s.color).style('stroke', 'var(--surface)').style('stroke-width', 2));
  });
  const ends = cfg.series.filter(s => s.pts.length).map(s => { const p = s.pts.slice().sort((a, b) => a.x - b.x)[0]; return { s, p, x: x(p.x), y: y(p.y), ly: y(p.y) }; }).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 13) ends[i].ly = ends[i - 1].ly + 13;
  ends.forEach(e => {
    svg.append('circle').attr('cx', e.x).attr('cy', e.y).attr('r', e.s.emph ? 5 : 4).style('fill', e.s.dash ? 'var(--surface)' : e.s.color).style('stroke', e.s.dash ? e.s.color : 'var(--surface)').style('stroke-width', 2);
    if (Math.abs(e.ly - e.y) > 3) svg.append('line').attr('x1', e.x + 5).attr('x2', e.x + 7).attr('y1', e.y).attr('y2', e.ly).style('stroke', 'var(--axis)');
    svg.append('text').attr('class', 'lbl ' + (e.s.emph ? 'hi' : 'muted')).attr('x', Math.min(e.x + 8, W - 2)).attr('y', e.ly + 4).style('font-size', narrow ? '10px' : '11px').text(e.s.endLabel != null ? e.s.endLabel : e.s.label);
  });
  const cross = svg.append('g').style('display', 'none').attr('pointer-events', 'none');
  cross.append('line').attr('y1', m.t).attr('y2', H - m.b).style('stroke', 'var(--muted)');
  const dots = cross.append('g');
  let cur = null;
  function at(xv, cy) {
    cur = xv;
    const rows = cfg.series.map(s => ({ s, p: s.pts.find(p => p.x === xv) })).filter(r => r.p && r.p.y != null);
    if (!rows.length) { cross.style('display', 'none'); hideTT(); return; }
    cross.style('display', null); cross.select('line').attr('x1', x(xv)).attr('x2', x(xv));
    dots.selectAll('circle').data(rows).join('circle').attr('cx', x(xv)).attr('cy', r => y(r.p.y)).attr('r', 4).style('fill', r => r.s.color).style('stroke', 'var(--surface)').style('stroke-width', 2);

  }
  const nearest = px => { const v = x.invert(px); return xs.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a, xs[0]); };
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).style('fill', 'transparent')
    .on('pointermove pointerdown', ev => { const [px] = d3.pointer(ev); at(nearest(px), ev.clientY); })
    .on('pointerleave', () => { cross.style('display', 'none'); hideTT(); });
  svg.on('keydown', ev => {
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
      ev.preventDefault();
      const i = cur == null ? 0 : xs.indexOf(cur) + (ev.key === 'ArrowRight' ? 1 : -1);

  }).on('blur', () => { cross.style('display', 'none'); hideTT(); });
  el.replaceChildren(svg.node());
}

  const HL = k => k.replace(/^\((\w+)\)\s*/, '').replace(/^./, c => c.toUpperCase()).replace('avg', 'average').replace('D>=0.60 / R<=0.40', 'D at 60% or more');
  const houseEl = chartBox(e => {
    const W = e._w || 600, rowH = 42, labW = Math.min(250, W * .44), Hh = HOU.length * rowH + 30;
    const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${Hh}`).attr('role', 'img').attr('aria-label', 'House seats by method');
    const x = d3.scaleLinear().domain([0, 435]).range([labW, W - 6]);
    HOU.forEach((r, i) => {
      const yy = i * rowH + 8, bh = 22;
      svg.append('text').attr('class', 'lbl').attr('x', 0).attr('y', yy + 15).style('font-family', 'var(--f-body)').style('font-size', W < 480 ? '10.5px' : '12px').style('fill', 'var(--text)').text(HL(r.method).slice(0, W < 480 ? 30 : 44));
      [[0, r.d, 'var(--dem)', 'Lean D or better'], [r.d, r.d + r.t, 'var(--both)', 'Toss-up'], [r.d + r.t, 435, 'var(--rep)', 'Lean R or better']].forEach(([a, b, col, lab], j) => {
        if (b <= a) return;
        const rect = svg.append('rect').attr('x', x(a) + 1).attr('y', yy).attr('width', Math.max(0, x(b) - x(a) - 2)).attr('height', bh).attr('rx', 3).style('fill', col).attr('tabindex', 0);
        if (j !== 1 || x(b) - x(a) > 26) svg.append('text').attr('class', 'lbl').attr('x', (x(a) + x(b)) / 2).attr('y', yy + 15).attr('text-anchor', 'middle').style('fill', j === 1 ? 'var(--on-hi)' : '#fff').style('font-size', '11px').text(String(b - a));
        const show = ev => { const [sx, sy] = ev && ev.clientX != null ? [ev.clientX, ev.clientY] : bboxOf(rect.node()); showTT([ttHead(HL(r.method)), ttRow('var(--dem)', 'Lean D or better', String(r.d), true), ttRow('var(--both)', 'Toss-up', String(r.t), true), ttRow('var(--rep)', 'Lean R or better', String(r.r), true)], sx, sy); };
        rect.on('pointermove pointerdown', show).on('pointerleave', hideTT).on('focus', () => show()).on('blur', hideTT);
      });
    });
    svg.append('line').attr('x1', x(218)).attr('x2', x(218)).attr('y1', 2).attr('y2', Hh - 16).style('stroke', 'var(--hi)').style('stroke-dasharray', '3 3');
    svg.append('text').attr('class', 'lbl muted').attr('x', x(218)).attr('y', Hh - 3).attr('text-anchor', 'middle').style('font-size', '10px').text('218: control');
    e.replaceChildren(svg.node());
  });
  const ledgerTable = rows => tableEl(rows[0].value.cells.map(([hd], i) => ({ k: 'c' + i, label: hd, sort: false, fmt: r => h('span', { style: 'font-size:12px' }, tagged(r.value.cells[i][1])) })), rows);
  const MS = C.misses.map(f => ({ ...f.value, f })).filter(r => r.type === 'Senate');
  const missT = tableEl([{ k: 'frame', label: 'Years' }, { k: 'tw', label: 'States Trump won', num: true, sort: false, fmt: r => { const a = MS.find(x => x.frame === r.frame && x.trump_won); return a ? fNum(a.miss, 2) + ' (' + a.n + ')' : 'n/a'; } },
    { k: 'tl', label: 'States Trump lost', num: true, sort: false, fmt: r => { const a = MS.find(x => x.frame === r.frame && !x.trump_won); return a ? fNum(a.miss, 2) + ' (' + a.n + ')' : 'n/a'; } }], [...new Set(MS.map(r => r.frame))].map(frame => ({ frame })));
  const G = C.governors;
  const ctrl = C.control.map(f => f.value);
  const pc = (race, venue) => { const x = ctrl.find(c => c.race === race && c.venue === venue && c.party === 'D'); return x ? fPct(100 * x.p, 1) : 'n/a'; };
  const EX = C.expected ? C.expected.value : null;
  w.append(card('primary', h('div', { class: 'card-head' }, h('div', {}, h('h3', {}, 'The Senate'), h('p', { class: 'sub' }, (EX ? 'The Kalshi prices imply about ' + fNum(EX.exp, 1) + ' Democratic and independent seats (34 not up, plus the summed prices of the ' + EX.races + ' races). ' : '') +
      'Democratic control: ' + pc('Senate', 'Kalshi') + ' on Kalshi, ' + pc('Senate', 'Polymarket') + ' on Polymarket' + (C.silver ? ', ' + C.silver.value.value + ' in Silver\'s model (relayed)' : '') + '. A 50-50 Senate is Republican control, because the vice president breaks ties. ' +
      'The bars below are scenarios, not forecasts: the polls as published, and our stress tests that repeat a past polling miss.'))), seatEl, srcs(C.senate.concat(C.control, C.expected ? [C.expected] : [], C.silver ? [C.silver] : []))),
    h('div', { class: 'support two' },
      card('compact', h('h4', {}, 'How far Senate polls missed'), h('p', { class: 'sub' }, 'Republicans\' gain on their final polling average, by whether Trump won the state in the prior presidential race (races in brackets). Positive: Republicans beat their polls.'), missT, srcs(C.misses)),
      card('compact', h('h4', {}, 'Senate methods, from the ledger'), ledgerTable(C.ledger.senate), C.ledger.senate.map(corrNote), srcs(C.ledger.senate))),
    h('div', { class: 'support', style: 'grid-template-columns:minmax(0,1fr)' }, card('', h('h4', {}, 'The House'), h('p', { class: 'sub' }, 'Seats leaning or better for each party, and toss-ups, under each method. Markets: Democratic control ' + pc('House', 'Kalshi') + ' on Kalshi, ' + pc('House', 'Polymarket') + ' on Polymarket.'), houseEl,
      legend([['var(--dem)', 'Lean Democratic or better'], ['var(--both)', 'Toss-up'], ['var(--rep)', 'Lean Republican or better']]), srcs(C.house))),
    h('div', { class: 'support two' }, card('compact', h('h4', {}, 'House methods, from the ledger'), ledgerTable(C.ledger.house), h('p', { class: 'note' }, 'District polls ran 1.2 (2018) and 1.1 (2022) points too Republican in the last two midterms; our race-by-race House reads (on the Races page) assume a presidential-year-sized miss and are a judgement (I).'), srcs(C.ledger.house)),
      card('', h('h4', {}, 'The governor races, by the markets'), h('dl', { class: 'kv' }, ['kal', 'poly'].map(k => [h('dt', {}, G[k].value.venue + ': races favouring the Democrat'), h('dd', {}, G[k].value.fav + ' of ' + G[k].value.n), h('dt', {}, G[k].value.venue + ': summed Democratic prices'), h('dd', {}, fNum(G[k].value.sum, 1))])),
        h('p', { class: 'note' }, 'All 36 governor races priced on both venues; the sum is the expected number of Democratic wins the prices imply.'), srcs([G.kal, G.poly]))));
}

/* ---------------------------------------------------------------- app shell: tabs, router, lazy data, theme */
const CACHE = {};
function getJSON(path) {
  if (!CACHE[path]) CACHE[path] = fetch(path).then(r => { if (!r.ok) throw new Error(path + ': HTTP ' + r.status); return r.json(); });
  return CACHE[path];
}
function run(name, fn) {
  try { fn(); } catch (e) {
    console.error(name, e);
    const sec = document.getElementById(PAGE_ID + '.' + name);
    const box = h('div', { class: 'wrap' }, h('div', { class: 'errbox' }, 'This section could not be drawn: ' + e.message));
    (sec || PAGE_EL).append(box);
  }
}
const PAGES = {
  home: { files: ['explainer', 'nation', 'explainer_national'], render: renderHome },
  nation: { files: ['nation', 'national'], usgeo: 'geo/us_states.json', render: renderNationPage },
  national: { files: ['national', 'context'], render: renderNationalPage },
  races: { files: ['races', 'forecasters'], render: renderRacesPage },
  polls: { files: ['polls', 'context'], render: () => run('polls', renderPolls) },
  fakepolls: { files: ['fakepolls'], render: () => run('fakepolls', renderFake) },
  coverage: { files: ['coverage'], render: () => run('coverage', renderCoverage) },
  method: { files: ['sources', 'explainer', 'evread'], render: () => run('method', renderMethod) },
  desk: { files: ['desk'], render: () => run('desk', renderDesk) },
};
const RENDERED = new Set();
let CUR = null;
function addStatePages() {
  (D.meta.states || []).forEach(st => {
    PAGES[st.slug] = st.kind === 'national' ? { files: [st.file], render: () => renderNatState(D[st.file]) } : { files: [st.file], geo: st.geo, render: () => renderState(D[st.file]) };
  });
}
function parseHash() {
  const raw = (location.hash || '').slice(1);
  if (!/^[A-Za-z0-9._~-]*$/.test(raw)) return { page: 'home', sub: '' };
  let [pg, ...rest] = raw.split('.');
  pg = (pg || 'home').toLowerCase();
  if (/^s-/.test(pg)) { const id = pg.slice(2); const s = D.meta.sections.find(x => x.id === id); if (s) { const st = (D.meta.states || [])[0]; return { page: s.page === 'texas' && st ? st.slug : s.page, sub: id }; } }
  const st = (D.meta.states || []).find(s => 'state-' + s.abbr.toLowerCase() === pg || s.slug === pg);
  if (st) pg = st.slug;
  if (!PAGES[pg] || (pg === 'desk' && !SHOW_DESK_NOTES)) return { page: 'home', sub: '' };
  return { page: pg, sub: rest.join('.') };
}
function pageEl(id) {
  let el = document.getElementById('page-' + id);
  if (!el) { el = h('div', { class: 'page', id: 'page-' + id, hidden: true }); document.getElementById('main').append(el); }
  return el;
}
async function route() {
  const { page, sub } = parseHash();
  const changed = page !== CUR;
  hideTT();
  document.querySelectorAll('#main > .page').forEach(p => { p.hidden = p.id !== 'page-' + page; });
  const el = pageEl(page); el.hidden = false;
  const bm = document.getElementById('bootmsg'); if (bm) bm.parentElement.remove();
  setActive(page);
  CUR = page;
  if (!RENDERED.has(page)) {
    RENDERED.add(page);
    el.replaceChildren(h('div', { class: 'wrap' }, h('p', { class: 'loading' }, 'Loading this page')));
    const P = PAGES[page];
    try {
      const got = await Promise.all(P.files.map(f => getJSON('data/' + f + '.json')));
      P.files.forEach((f, i) => { D[f] = got[i]; });
      if (P.geo) GEO = await getJSON(P.geo);
      if (P.usgeo) USGEO = await getJSON(P.usgeo);
    } catch (e) {
      el.replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'errbox' }, 'This page\'s data did not load (' + e.message + '). The page reads data/*.json next to it.')));
      RENDERED.delete(page); return;
    }
    el.replaceChildren();
    PAGE_EL = el; PAGE_ID = page;
    P.render();
  }
  PAGE_EL = el; PAGE_ID = page;
  setTimeout(kickCharts, 30);
  setTimeout(() => {
    if (sub) { const t = document.getElementById(page + '.' + sub); if (t) { t.scrollIntoView(); return; } }
    if (changed) window.scrollTo(0, 0);
  }, 40);
}
function setActive(page) {
  const tab = /^state-/.test(page) ? 'nation' : page;   // a national state page sits under the States tab
  document.querySelectorAll('#tabs a, #navpanel a').forEach(a => { if (a.dataset.route === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function buildNav() {
  const M = D.meta;
  const pages = [M.pages.find(p => p.route === 'home')].concat((M.states || []).filter(s => s.tab).map(s => ({ route: s.slug, title: s.name })), M.pages.filter(p => !['home', 'texas'].includes(p.route) && (SHOW_DESK_NOTES || p.route !== 'desk')));
  const mk = p => h('a', { href: '#' + p.route, 'data-route': p.route, class: p.route === 'desk' ? 'internal' : null }, p.title);
  const ext = () => h('a', { href: 'https://www.intellz.com', rel: 'noopener' }, 'Intellz');
  document.getElementById('tabs').replaceChildren(...pages.map(mk), ext());
  const panel = document.getElementById('navpanel');
  panel.replaceChildren(...pages.map(mk), ext());
  const btn = document.getElementById('menuBtn');
  btn.addEventListener('click', () => { const o = panel.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)); });
  panel.addEventListener('click', e => { if (e.target.closest('a')) { panel.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); } });
  document.getElementById('asof').replaceChildren('Data through ', h('b', {}, M.site.as_of_short));
  document.getElementById('footAsof').textContent = M.site.as_of + '. Built ' + M.site.built + '.';
}
function effectiveTheme() { const t = document.documentElement.getAttribute('data-theme'); if (t) return t; return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
function syncThemeBtn() { const b = document.getElementById('themeBtn'); const t = effectiveTheme(); b.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); b.title = b.getAttribute('aria-label'); }
(function initTheme() {
  try { const t = localStorage.getItem('evd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage unavailable */ }
  syncThemeBtn();
  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('evd-theme', next); } catch (e) { /* ignore */ }
    syncThemeBtn(); redrawAll();
  });
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { syncThemeBtn(); redrawAll(); });
})();

/* ---------------------------------------------------------------- boot */
async function boot() {
  try { D.meta = await getJSON('data/meta.json'); }
  catch (e) { document.getElementById('main').replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'errbox' }, 'The data files did not load (' + e.message + '). This page reads data/*.json next to it.'))); return; }
  GR = D.meta.grades;
  addStatePages();
  buildNav();
  window.addEventListener('hashchange', route);
  route();
}
if (window.d3 && window.topojson) boot();
else window.addEventListener('load', () => { if (window.d3) boot(); else document.getElementById('main').replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'errbox' }, 'The charting library did not load. Check the connection and reload.'))); });
})();
</script>
